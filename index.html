<style id="rcss">
/* ===== resume pages: shared ===== */
.page{position:relative;overflow:hidden;background:#fff;color:#1f2430;font-family:var(--bf);font-size:var(--fs);line-height:var(--lh);display:flex;flex-direction:column;text-align:left;--acc-soft:color-mix(in srgb,var(--acc) 12%,#fff);-webkit-text-size-adjust:none}
.page *{box-sizing:border-box}
.page h1,.page h2,.page p,.page ul{margin:0;padding:0}
.page .body{display:flex;flex:1;min-height:0}
.page .main{flex:1;min-width:0;padding:var(--m)}
.page .side{flex:none}
.page .sec{display:flow-root;margin-bottom:var(--ig);cursor:pointer}
.page .sec.last{margin-bottom:var(--gap)}
.page .sh{font-family:var(--hf);font-weight:700;font-size:1.12em;color:var(--acc);margin-bottom:.55em;line-height:1.2}
.page.caps .sh{text-transform:uppercase;letter-spacing:.07em;font-size:.98em}
.page .item{display:flow-root}
.page .ih{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.page .it{font-weight:700;color:#111827}
.page .id{font-size:.88em;color:#667085;white-space:nowrap;text-align:right}
.page .is{font-size:.95em;color:#475467;margin-top:1px}
.page .item ul{margin-top:.35em;padding-left:1.1em;list-style:none}
.page .item li{margin:.14em 0;position:relative}
.page .item li::before{content:"•";position:absolute;left:-1.05em}
.page .item p{white-space:pre-line;margin-top:.25em}
.page .sum{white-space:pre-line}
.page .hdr{display:flow-root;margin-bottom:var(--gap);cursor:pointer}
.page .hdr h1,.page .banner h1,.page .sp h1{font-family:var(--hf);font-size:2.5em;line-height:1.08;font-weight:800;color:#111827;letter-spacing:-.01em;overflow-wrap:anywhere}
.page .ttl{font-size:1.2em;color:var(--acc);font-weight:600;margin-top:.2em}
.page .cts{display:flex;flex-wrap:wrap;gap:.25em 1.1em;margin-top:.6em;font-size:.93em;color:#475467}
.page .ct{display:inline-flex;align-items:center;gap:.4em;overflow-wrap:anywhere}
.page .ct svg{width:1em;height:1em;color:var(--acc);flex:none}
.page .hl{display:flex;align-items:center;gap:1.1em}

.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.pvbox{overflow-x:auto;margin:0 -16px;padding:0 16px}
.pv{width:max-content;margin:0 auto}

/* tools grid */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tcard{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--surface);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.tcard span{font-size:26px}.tcard b{font-family:'Sora',sans-serif;font-size:15px}.tcard small{color:var(--muted);font-size:12.5px;line-height:1.3}

/* versions */
.vr{display:flex;align-items:center;gap:6px;background:var(--solid);border:2px solid var(--line);border-radius:18px;padding:8px;margin-top:8px}
.vr.on{border-color:var(--indigo)}
.vname{flex:1;min-width:0;text-align:left;padding:4px 6px}
.vname b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vname small{color:var(--muted);font-size:12.5px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 14px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:10}
.tabs{pointer-events:auto;display:flex;align-items:flex-end;justify-content:space-between;width:100%;max-width:508px;background:rgba(255,255,255,.93);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--line);border-radius:30px;padding:8px;box-shadow:0 16px 34px -14px rgba(22,33,62,.55)}
@media (prefers-color-scheme: dark){.tabs{background:rgba(36,44,92,.94)}}
.tabs button.t{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:20px;font-size:11px;font-weight:700;color:var(--muted)}
.tabs button.t svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.t[aria-selected="true"]{color:var(--ink);background:color-mix(in srgb,var(--indigo) 18%,transparent)}
.tabs .plus{flex:0 0 62px;height:62px;margin:-32px 4px 0;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;border:4px solid var(--solid);box-shadow:0 5px 0 #C98E00,0 16px 22px -10px rgba(255,183,3,.85)}
.tabs .plus svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.tabs .plus:active{transform:translateY(3px);box-shadow:0 2px 0 #C98E00}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,14,40,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;z-index:20}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;display:flex;justify-content:center;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.25,1)}
.sheet.on{transform:none}
.sheet-in{background:var(--solid);width:100%;max-width:560px;border-radius:30px 30px 0 0;padding:10px 18px calc(28px + env(safe-area-inset-bottom,0px));max-height:93vh;overflow-y:auto;overscroll-behavior:contain;border-top:6px solid var(--indigo)}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:24px;font-weight:700;margin-bottom:6px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);background:var(--ink);color:var(--on-ink);padding:12px 20px;border-radius:99px;font-weight:700;z-index:50;transition:transform .35s cubic-bezier(.2,.9,.25,1);max-width:90%;text-align:center;box-shadow:0 10px 24px -8px rgba(0,0,0,.5)}
.toast.on{transform:translate(-50%,0)}

#app.enter>*{animation:rise .5s cubic-bezier(.2,.9,.25,1) both}
#app.enter>*:nth-child(2){animation-delay:.05s}#app.enter>*:nth-child(3){animation-delay:.1s}#app.enter>*:nth-child(4){animation-delay:.15s}#app.enter>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* printing */
#printArea{display:none}
@media print{
  html,body{background:#fff!important;padding:0!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea .page{break-after:page;page-break-after:always;margin:0;box-shadow:none}
  #printArea .page:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.impc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:inherit;border-style:dashed;border-width:2px;border-color:color-mix(in srgb,var(--indigo) 45%,transparent)}
.impc .ii{flex:0 0 46px;height:46px;border-radius:15px;background:color-mix(in srgb,var(--indigo) 16%,transparent);display:grid;place-items:center;font-size:24px}
.impc b{display:block;font-family:'Sora',sans-serif;font-size:15px}.impc small{color:var(--muted);font-size:12.5px}
.warnbox{background:color-mix(in srgb,var(--coral) 18%,var(--solid));border:1.5px solid var(--coral);border-radius:16px;padding:11px 14px;margin:10px 0;font-weight:600;font-size:14px}

/* ---------- job match ---------- */
function jdKeywords(txt){
  var toks=(txt.toLowerCase().match(/[a-z][a-z0-9+#.\-]{1,}/g)||[]).map(function(t){return t.replace(/[.\-]+$/,'')}).filter(function(t){return t.length>=3});
  var f={};
  toks.forEach(function(t){if(!STOP.has(t))f[t]=(f[t]||0)+1});
  for(var i=0;i<toks.length-1;i++){var a=toks[i],b=toks[i+1];if(STOP.has(a)||STOP.has(b))continue;var k=a+' '+b;f[k]=(f[k]||0)+1}
  var l=Object.keys(f).filter(function(k){return k.indexOf(' ')<0||f[k]>=2}).map(function(k){return {k:k,n:f[k]}});
  l.sort(function(a,b){return b.n-a.n||b.k.length-a.k.length});
  return l.slice(0,24);
}
function cap(s){return s.replace(/\b[a-z]/g,function(c){return c.toUpperCase()})}

  if(rv&&el.type==='range'){var u=p==='style.fs'?' pt':p==='style.gap'?' px':p==='style.mx'?' mm':'';rv.textContent=v+u}
  if(p.indexOf('.bul.')>-1){var h=document.querySelector('[data-for="'+p+'"]');if(h)h.textContent=hintFor(v)}
  if(p==='summary'){var c=$('sumCount');if(c)c.textContent=v.length+' characters · aim for 150 to 450'}
  if(el.tagName==='TEXTAREA'&&el.id!=='bk'&&el.id!=='impText'&&el.id!=='origT'){el.style.height='auto';el.style.height=Math.max(el.scrollHeight+2,60)+'px'}
  if(el.tagName==='TEXTAREA'&&el.id!=='bk'&&el.id!=='jd'&&el.id!=='cl_out'){el.style.height='auto';el.style.height=Math.max(el.scrollHeight+2,60)+'px'}
  touch();
  if(ui.tab==='design')refreshDesign();
}
document.addEventListener('input',function(e){var el=e.target;if(el.dataset&&el.dataset.f)onField(el);else if(el.dataset&&el.dataset.cl){var o=$('cl_out');if(o)o.value=letterText()}});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.f)onField(el);
  else if(el.dataset&&el.dataset.cl){var o=$('cl_out');if(o)o.value=letterText()}
  else if(el.id==='impFile'&&el.files&&el.files[0]){impFileChange(el.files[0]);el.value=''}
  else if(el.id==='photoIn'&&el.files&&el.files[0]){
    var fr=new FileReader();
    fr.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=300;c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,300,300);R().p.photo=c.toDataURL('image/jpeg',.85);touch();if(ui.ed)refreshEd();toast('Photo added ✓')};im.src=fr.result};
    fr.readAsDataURL(el.files[0]);
  }
});
document.addEventListener('toggle',function(e){if(e.target.classList&&e.target.classList.contains('ideas'))ui.ideas=e.target.open},true);
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(el){var f=acts[el.dataset.act];if(f){f(el);return}}
  var sec=e.target.closest('#pv [data-sec]');
  if(sec){var s=sec.dataset.sec,i=sec.dataset.i;openEd(s);if(i!=null&&i!==''&&cfg(s)&&s!=='skills'&&s!=='languages'&&s!=='summary'&&!(s==='references'&&R().refText)){ui.ed.i=+i;openSheet(edHtml())}}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeSheet();
  if(e.key==='Enter'&&e.target.id==='newSkill'){e.preventDefault();acts.addSkillTxt()}
  if(e.key==='Enter'&&e.target.id==='newLang'){e.preventDefault();acts.addLangTxt()}
});

/* ---------- start ---------- */
var FONTLINK='';
load();snap();
FONTLINK=($('gf')||{}).href||'';
render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(ui.tab==='preview')drawPreview();if(ui.tab==='design')refreshDesign()});

})();
</script>
</body>
